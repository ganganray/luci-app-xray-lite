name: Build OpenWrt Packages

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipk:
    name: Build .ipk (OpenWrt 24.10)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup OpenWrt SDK (24.10)
        run: |
          SDK_URL="https://downloads.openwrt.org/releases/24.10.0/targets/x86/64/openwrt-sdk-24.10.0-x86-64_gcc-13.3.0_musl.Linux-x86_64.tar.zst"
          sudo apt-get update
          sudo apt-get install -y zstd build-essential libncurses5-dev gawk git subversion libssl-dev gettext unzip file
          curl -sL "$SDK_URL" -o sdk.tar.zst
          tar -I zstd -xf sdk.tar.zst
          mv openwrt-sdk-* sdk

      - name: Build Package (.ipk)
        run: |
          cd sdk
          ./scripts/feeds update base luci
          ./scripts/feeds install luci-base
          mkdir -p package/luci-app-xray-lite
          cp -r ../Makefile ../LICENSE ../htdocs ../root ../po package/luci-app-xray-lite/
          make defconfig
          make package/luci-app-xray-lite/compile V=s
          mkdir -p ../bin/ipk
          find bin/ -type f -name "*xray-lite*.ipk" -exec cp {} ../bin/ipk/ \;

      - name: Upload IPK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-xray-lite-ipk
          path: bin/ipk/*

  build-apk:
    name: Build .apk (SNAPSHOT)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup OpenWrt SDK (SNAPSHOT)
        run: |
          SDK_URL="https://downloads.openwrt.org/snapshots/targets/x86/64/openwrt-sdk-x86-64_gcc-14.2.0_musl.Linux-x86_64.tar.zst"
          sudo apt-get update
          sudo apt-get install -y zstd build-essential libncurses5-dev gawk git subversion libssl-dev gettext unzip file apk-tools
          curl -sL "$SDK_URL" -o sdk.tar.zst
          tar -I zstd -xf sdk.tar.zst
          mv openwrt-sdk-* sdk

      - name: Build Package (.apk)
        run: |
          cd sdk
          ./scripts/feeds update base luci
          ./scripts/feeds install luci-base
          mkdir -p package/luci-app-xray-lite
          cp -r ../Makefile ../LICENSE ../htdocs ../root ../po package/luci-app-xray-lite/
          make defconfig
          make package/luci-app-xray-lite/compile V=s
          mkdir -p ../bin/apk
          find bin/ -type f -name "*xray-lite*.apk" -exec cp {} ../bin/apk/ \;

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-xray-lite-apk
          path: bin/apk/*

  release:
    name: Create Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-ipk, build-apk]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Prepare Release Assets
        run: |
          mkdir -p release-dist
          find release-artifacts/ -type f \( -name "*.ipk" -o -name "*.apk" \) -exec cp {} release-dist/ \;
          cd release-dist
          sha256sum * > sha256sums.txt
          cat sha256sums.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-dist/*
          draft: false
          prerelease: false
          generate_release_notes: true
