name: Build OpenWrt Packages

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipk:
    name: Build .ipk (OpenWrt 24.10)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup OpenWrt SDK (24.10)
        run: |
          SDK_NAME=$(curl -sL --retry 3 https://downloads.openwrt.org/releases/24.10.0/targets/x86/64/sha256sums | grep "openwrt-sdk" | awk -F'*' '{print $2}')
          SDK_URL="https://downloads.openwrt.org/releases/24.10.0/targets/x86/64/${SDK_NAME:-openwrt-sdk-24.10.0-x86-64_gcc-13.3.0_musl.Linux-x86_64.tar.zst}"
          echo "Downloading $SDK_URL..."
          curl -sL --retry 3 "$SDK_URL" -o sdk.tar.zst
          mkdir -p sdk
          zstd -dc sdk.tar.zst | tar -xf - -C sdk --strip-components=1
          rm -f sdk.tar.zst

      - name: Build Package (.ipk)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          trap 'ERR=$?; echo "FAILED at $BASH_COMMAND with $ERR" > /tmp/failure.txt; cd $GITHUB_WORKSPACE; git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"; git checkout -B debug-failure; cp /tmp/failure.txt failure.txt; [ -f /tmp/build-ipk.log ] && cp /tmp/build-ipk.log build-ipk.log; git add .; git commit -m "debug: capture failure"; git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" debug-failure --force; exit $ERR' ERR
          cd sdk
          rm -rf feeds/luci
          git clone --depth 1 -b master https://github.com/openwrt/luci.git feeds/luci
          make -C feeds/luci/modules/luci-base/src po2lmo
          sudo cp feeds/luci/modules/luci-base/src/po2lmo /usr/bin/po2lmo
          sudo cp feeds/luci/modules/luci-base/src/po2lmo /usr/local/bin/po2lmo
          mkdir -p staging_dir/host/bin
          cp feeds/luci/modules/luci-base/src/po2lmo staging_dir/host/bin/po2lmo
          mkdir -p package/luci-app-xray-lite
          cp -r ../Makefile ../LICENSE ../htdocs ../root ../po package/luci-app-xray-lite/
          echo "CONFIG_PACKAGE_luci-app-xray-lite=m" > .config
          echo "CONFIG_PACKAGE_luci-i18n-xray-lite-zh-cn=m" >> .config
          make defconfig
          make package/luci-app-xray-lite/compile -j$(nproc) V=s 2>&1 | tee /tmp/build-ipk.log
          mkdir -p ../bin/ipk
          find bin/ -type f \( -name "*xray-lite*.ipk" -o -name "*xray-lite*.apk" \) -exec cp -v {} ../bin/ipk/ \;
          ls -la ../bin/ipk/
          if [ -z "$(ls -A ../bin/ipk 2>/dev/null)" ]; then
            echo "Error: No .ipk package was generated!"
            exit 1
          fi

      - name: Upload IPK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-xray-lite-ipk
          path: bin/ipk/*

  build-apk:
    name: Build .apk (OpenWrt 25.x)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup OpenWrt SDK (OpenWrt 25.x)
        run: |
          SDK_NAME=$(curl -sL --retry 3 https://downloads.openwrt.org/snapshots/targets/x86/64/sha256sums | grep "openwrt-sdk" | awk -F'*' '{print $2}')
          SDK_URL="https://downloads.openwrt.org/snapshots/targets/x86/64/$SDK_NAME"
          echo "Downloading $SDK_URL..."
          curl -sL --retry 3 "$SDK_URL" -o sdk.tar.zst
          mkdir -p sdk
          zstd -dc sdk.tar.zst | tar -xf - -C sdk --strip-components=1
          rm -f sdk.tar.zst

      - name: Build Package (.apk)
        run: |
          cd sdk
          rm -rf feeds/luci
          git clone --depth 1 -b master https://github.com/openwrt/luci.git feeds/luci
          make -C feeds/luci/modules/luci-base/src po2lmo
          sudo cp feeds/luci/modules/luci-base/src/po2lmo /usr/bin/po2lmo
          sudo cp feeds/luci/modules/luci-base/src/po2lmo /usr/local/bin/po2lmo
          mkdir -p staging_dir/host/bin
          cp feeds/luci/modules/luci-base/src/po2lmo staging_dir/host/bin/po2lmo
          mkdir -p package/luci-app-xray-lite
          cp -r ../Makefile ../LICENSE ../htdocs ../root ../po package/luci-app-xray-lite/
          echo "CONFIG_PACKAGE_luci-app-xray-lite=m" > .config
          echo "CONFIG_PACKAGE_luci-i18n-xray-lite-zh-cn=m" >> .config
          make defconfig
          make package/luci-app-xray-lite/compile -j$(nproc) V=s
          mkdir -p ../bin/apk
          find bin/ -type f \( -name "*xray-lite*.apk" -o -name "*xray-lite*.ipk" \) -exec cp -v {} ../bin/apk/ \;
          ls -la ../bin/apk/
          if [ -z "$(ls -A ../bin/apk 2>/dev/null)" ]; then
            echo "Error: No .apk package was generated!"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-xray-lite-apk
          path: bin/apk/*

  release:
    name: Create Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-ipk, build-apk]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Prepare Release Assets
        run: |
          mkdir -p release-dist
          find release-artifacts/ -type f \( -name "*.ipk" -o -name "*.apk" \) -exec cp -v {} release-dist/ \;
          cd release-dist
          sha256sum * > sha256sums.txt
          cat sha256sums.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-dist/*
          draft: false
          prerelease: false
          generate_release_notes: true
